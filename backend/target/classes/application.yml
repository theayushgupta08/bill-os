spring:
  application:
    name: billos-api

  datasource:
    # Set your Supabase connection string here or via environment variables
    # e.g., jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    jwt:
      # Must be at least 256 bits (32 bytes)
      secret: ${JWT_SECRET:supersecretkeythatisverylongandsecurefortestingonlydoinproduction}
      expiration: 86400000 # 1 day in milliseconds
      refresh-expiration: 604800000 # 7 days in milliseconds

logging:
  level:
    org.springframework.security: INFO
    com.billos: DEBUG
