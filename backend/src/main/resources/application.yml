spring:
  application:
    name: billos-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    # Set your Supabase connection string here or via environment variables
    # e.g., jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.billos.api.tenant.TenantIdentifierResolver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  security:
    supabase:
      # Supabase dashboard -> Project Settings -> API -> JWT Secret.
      # Used verbatim (raw UTF-8 bytes) to verify HS256 tokens minted by Supabase Auth.
      # Required: the application fails fast on startup if this is unset.
      jwt-secret: ${SUPABASE_JWT_SECRET:}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
    com.billos: DEBUG
