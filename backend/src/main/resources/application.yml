spring:
  application:
    name: billos-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    # Set your Supabase connection string here or via environment variables
    # e.g., jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: com.billos.api.tenant.TenantIdentifierResolver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL:https://qmqvaljcmcgqsxkoaoxc.supabase.co/auth/v1/.well-known/jwks.json}
          jws-algorithms: ES256


server:
  port: 8080
  # Resolve the client IP (for rate limiting) and scheme from X-Forwarded-* safely via Tomcat's RemoteIpValve:
  # the header is only honoured when it arrives from a trusted proxy. Private/loopback ranges are trusted by default
  # (covers Render's internal load balancer). If a public CDN sits in front, add its ranges with
  # SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES (regex) — otherwise every client appears as the CDN's IP.
  forward-headers-strategy: native
  error:
    # API errors are rendered by GlobalExceptionHandler; don't leak raw exception text from anything else
    include-message: never
    include-binding-errors: never

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,${APP_FRONTEND_URL:https://bill-os-nine.vercel.app}
  supabase:
    url: ${SUPABASE_URL:https://qmqvaljcmcgqsxkoaoxc.supabase.co}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  email:
    base-domain: ${EMAIL_BASE_DOMAIN:billos.app}


logging:
  level:
    # TRACE/DEBUG here logs auth details on every request — raise locally via env, never by default.
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.web.cors: ${LOG_LEVEL_CORS:INFO}
    com.billos: ${LOG_LEVEL_APP:INFO}
